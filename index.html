<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13223b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Kingshot Assistant</title><style>body{font-family:system-ui;background:#0b1220;color:#e9f0ff;margin:0}header{padding:24px;background:#172e55}main{max-width:850px;margin:auto;padding:15px}h1{margin:0}.notice{color:#f5d99d;background:#302a20;padding:14px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#18253a;border:1px solid #354a6b;border-radius:14px;padding:16px}input{box-sizing:border-box;width:100%;background:#101c2e;color:white;border:1px solid #4c6080;padding:10px;border-radius:8px;font-size:16px}button{background:#3479d8;color:white;border:0;padding:10px;border-radius:8px;margin:8px 3px 0 0;font-weight:700}button.alt{background:#364b68}small{color:#b5c5de}.status{color:#9bdbb5;margin-top:10px}label{display:block;margin-top:8px}</style></head><body><header><h1>⚔️ Kingshot Assistant</h1><small>24 مهمة • مجاني • حساب واحد</small></header><main><p class="notice">لوحة متابعة يدوية فقط. لا تتحكم في اللعبة ولا ترسل إشعارات مضمونة عند إغلاق الآيفون. بياناتك محفوظة في هذا المتصفح.</p><section class="card"><label>اسم الحساب (اختياري)</label><input id="account" placeholder="الحساب الرئيسي"><p id="summary"></p><button id="export">تصدير نسخة احتياطية</button><button id="import" class="alt">استيراد نسخة</button><input id="file" type="file" accept=".json" hidden><button id="pending" class="alt">غير المكتملة</button><button id="all" class="alt">عرض الكل</button></section><div class="grid" id="grid"></div></main><script>const names=["تدريب الجنود","ترقية الجنود","شفاء الجنود","جمع الموارد","البناء والتطوير","الأبحاث","مساعدات التحالف","تبرعات التحالف","المكافآت اليومية","الفعاليات","إرسال جمع الموارد","متابعة المسيرات","الاستكشاف","المهام اليومية","مكافآت VIP","بريد اللعبة","الساحة","حشود التحالف","صيد الوحوش","طابور البناء","طابور الأبحاث","سعة المستشفى","التحديث اليومي","متابعة الدرع"];const key='kingshot_live_v1';let data={};try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch{};const save=()=>localStorage.setItem(key,JSON.stringify(data));const grid=document.getElementById('grid');let filter='all';const account=document.getElementById('account');account.value=localStorage.getItem('kingshot_account_label')||'';account.oninput=()=>localStorage.setItem('kingshot_account_label',account.value);function draw(){grid.innerHTML='';let done=0,active=0,ready=0;names.forEach((name,i)=>{const d=data[i]||{};if(d.done)done++;if(d.until>Date.now())active++;if(d.until&&d.until<=Date.now())ready++;if(filter==='pending'&&d.done)return;const card=document.createElement('section');card.className='card';const title=document.createElement('h3');title.textContent=name;card.append(title);const label=document.createElement('label');label.textContent='المدة بالدقائق';card.append(label);const mins=document.createElement('input');mins.type='number';mins.min='1';mins.max='525600';mins.value=d.mins||60;card.append(mins);const note=document.createElement('input');note.placeholder='ملاحظات المهمة';note.value=d.note||'';note.oninput=()=>{data[i]={...data[i],note:note.value};save()};card.append(note);const start=document.createElement('button');start.textContent='بدء المؤقت';start.onclick=()=>{const m=Number(mins.value);if(!Number.isFinite(m)||m<1||m>525600){alert('مدة غير صحيحة');return}data[i]={...data[i],mins:m,until:Date.now()+m*60000,done:false};save();draw()};card.append(start);const complete=document.createElement('button');complete.className='alt';complete.textContent='تم الإنجاز';complete.onclick=()=>{data[i]={...data[i],done:true,until:null};save();draw()};card.append(complete);const reset=document.createElement('button');reset.className='alt';reset.textContent='إلغاء';reset.onclick=()=>{data[i]={...data[i],done:false,until:null};save();draw()};card.append(reset);const status=document.createElement('div');status.className='status';status.textContent=d.until>Date.now()?'⏳ متبقٍ '+Math.ceil((d.until-Date.now())/60000)+' دقيقة':d.until?'🔔 انتهى المؤقت — راجع اللعبة':d.done?'✅ مكتملة':'○ لم تبدأ';card.append(status);grid.append(card)});document.getElementById('summary').textContent='المكتملة: '+done+' / '+names.length+' | مؤقتات نشطة: '+active+' | جاهزة: '+ready}draw();setInterval(draw,30000);document.getElementById('pending').onclick=()=>{filter='pending';draw()};document.getElementById('all').onclick=()=>{filter='all';draw()};document.getElementById('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:1,data})],{type:'application/json'}));a.href=u;a.download='kingshot-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());if(o.version!==1||!o.data||typeof o.data!=='object')throw Error();data={};for(let i=0;i<names.length;i++){const d=o.data[i];if(d&&typeof d==='object')data[i]={mins:Number(d.mins)||60,note:String(d.note||'').slice(0,100),until:Number(d.until)||null,done:!!d.done}}save();draw()}catch{alert('ملف غير صالح')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
